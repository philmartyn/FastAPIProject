services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Lightweight web UI for browsing the DB -> http://localhost:8080
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  app:
    build: .
    env_file: .env
    environment:
      # Override the host: inside the compose network the DB is reachable as `db`.
      DATABASE_URL: postgresql+asyncpg://notes:notes@db:5432/notes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

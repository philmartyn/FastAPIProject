{# Base layout. Child templates override the blocks below. #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FastAPI Notes{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {# htmx is vendored locally so the app works offline. #}
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1><a href="/">📝 FastAPI Notes</a></h1>
    {% block header %}{% endblock %}
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
